services:
  # The site itself. No host port: only Caddy reaches it, over the compose
  # network, so it never collides with other containers on the server.
  site:
    build:
      context: .
      target: runner
    image: nyx-portfolio:latest
    expose:
      - '3000'
    environment:
      NODE_ENV: production
    restart: unless-stopped

  # Caddy in front, published on port 80 (HTTP_PORT in .env to change it).
  caddy:
    image: caddy:2.8.4-alpine
    depends_on:
      - site
    ports:
      - '${HTTP_PORT:-80}:80'
      # for HTTPS on a domain, also publish 443:
      # - '443:443'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      # the folder, not the file: git replaces the file on pull, and a
      # single-file bind mount would keep showing the old one
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
